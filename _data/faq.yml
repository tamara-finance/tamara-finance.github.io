# שאלות נפוצות - מופיעות בדף הבית ומסומנות לגוגל ולכלי AI
- q: "מה עושה יועצת משכנתאות?"
  a: "יועצת משכנתאות מלווה אתכם בכל תהליך לקיחת המשכנתא: בודקת את המצב הכלכלי שלכם, בונה תמהיל מסלולים שמתאים לחיים שלכם ולא לבנק, משווה בין הצעות של בנקים שונים ומנהלת מולם את המשא ומתן - עד החתימה."
- q: "אפשר לקבל ייעוץ משכנתא אונליין?"
  a: "כן. הייעוץ מתקיים גם אונליין בשיחות וידאו, ללקוחות מכל הארץ - מהצפון ועד אילת - עם אותו ליווי צמוד. למי שמעדיף להיפגש, יש פגישות פרונטליות ברחובות והסביבה."
- q: "מתי כדאי לבדוק מיחזור משכנתא?"
  a: "כדאי לבדוק מיחזור כשהריביות במשק משתנות, כשההחזר החודשי מכביד, כשיש שינוי בהכנסה או במצב המשפחתי, או פשוט אם עברו כמה שנים מאז שלקחתם את המשכנתא. בדיקה מסודרת מראה אם מעבר למסלולים אחרים או לבנק אחר יכול לחסוך לכם כסף."
- q: "מה ההבדל בין מיחזור משכנתא לאיחוד הלוואות?"
  a: "מיחזור משכנתא הוא שינוי של המשכנתא הקיימת - מסלולים, ריביות או בנק - כדי להוזיל אותה. איחוד הלוואות מרכז כמה הלוואות שונות (רכב, מינוס, כרטיסי אשראי) להחזר חודשי אחד, נמוך ומסודר יותר. לפעמים נכון לשלב בין השניים."
- q: "האם יש ליווי משכנתא לעצמאים?"
  a: "כן. עצמאים ובעלי עסקים נדרשים בדרך כלל להציג לבנק מסמכים נוספים, כמו דוחות כספיים ואישורי הכנסה. הליווי כולל הכנה נכונה של המסמכים והצגת התיק לבנקים כך שיהיה לכם את הסיכוי הטוב ביותר לתנאים טובים."
- q: "מה זו משכנתא הפוכה?"
  a: "משכנתא הפוכה מיועדת לבני 60 ומעלה שבבעלותם דירה. היא מאפשרת לקבל כסף על בסיס ערך הנכס - בתשלום חד-פעמי או חודשי - בלי למכור את הבית ובלי לעבור ממנו. חשוב לבדוק את המשמעויות לפני שמחליטים, ולכן כדאי לקבל ייעוץ מקצועי."
- q: "איך מתחילים?"
  a: "משאירים פרטים בטופס, מתקשרים או שולחים הודעה בוואטסאפ, וקובעים שיחת היכרות ראשונה ללא התחייבות. בשיחה נבין יחד מה המצב שלכם ומה הצעד הנכון הבא."
