services:
  eyebrow: "השירותים"
  title: "תחומי התמחות"
  subtitle: "פתרונות משכנתא מקיפים לכל שלב בחיים - מהדירה הראשונה ועד לאופטימיזציה של משכנתא קיימת"
  cards:
    - icon: home
      title: "ייעוץ משכנתאות"
      text: "ליווי מקצועי לאורך כל הדרך - מתכנון ראשוני ועד לחתימה על המשכנתא המשתלמת ביותר."
    - icon: refresh
      title: "מיחזור משכנתא"
      text: "בדיקת משכנתא קיימת, הפחתת ריבית והחזר חודשי על ידי בחינת מסלולים חלופיים ומעבר לבנק משתלם יותר."
    - icon: key
      title: "משכנתא לדירה ראשונה"
      text: "ליווי מלא משלב החלום ועד המפתח בדלת - תכנון, אישור עקרוני ומשכנתא מותאמת אישית."
    - icon: bank
      title: "איחוד הלוואות"
      text: "איחוד הלוואות קיימות להחזר חודשי אחד, נמוך ומסודר - לחיסכון של עשרות אלפי שקלים."
    - icon: briefcase
      title: "משכנתא לעצמאים"
      text: "פתרונות מימון לעצמאים ובעלי עסקים, כולל התמודדות עם דוחות דו-שנתיים ואישורי הכנסה."
    - icon: arrow
      title: "משכנתא הפוכה"
      text: "ייעוץ לבני 60+ על משכנתא הפוכה - המרת ערך הנכס להכנסה חודשית ללא ויתור על הבית."
online:
  title: "לא גרים באזור? אין בעיה."
  text: "הייעוץ מתקיים גם אונליין, בשיחות וידאו, ללקוחות מכל הארץ - מהצפון ועד אילת. אותו ליווי צמוד, בלי לצאת מהבית. למי שמעדיף להיפגש, יש פגישות פרונטליות ברחובות והסביבה."
  button: "לתיאום שיחת אונליין"
about:
  eyebrow: "מי אני"
  name: "תמרה אביב"
  role: "יועצת משכנתאות • כלכלנית"
  paragraphs:
    - "אחרי שנים ככלכלנית שכירה, עם ניסיון, יציבות וביטחון, גיליתי שהתשוקה שלי היא ייעוץ משכנתאות. הבנתי שמשכנתא היא לא רק מספרים - היא אחת ההחלטות הכלכליות הכי משמעותיות בחיים, שמשפיעה על הביטחון, השקט הנפשי והדרך שבה נחיה שנים קדימה."
    - "ראיתי אנשים שלוקחים את ההתחייבויות הגדולות ביותר בלי להבין את המשמעויות, בלי לדעת שאפשר לחסוך עשרות ואפילו מאות אלפי שקלים. לכן בחרתי בתחום הזה ובדיוק שם אני נכנסת."
  goal_title: "המטרה שלי:"
  goal: "לעזור לכם לקבל החלטות מושכלות, לבנות משכנתא שמתאימה לחיים שלכם ולא של הבנק, ולעבור את התהליך בתחושת ביטחון, סדר, רוגע ושליטה."
  button: "בואו נדבר"
