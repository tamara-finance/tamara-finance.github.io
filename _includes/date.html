{%- assign months = "ינואר,פברואר,מרץ,אפריל,מאי,יוני,יולי,אוגוסט,ספטמבר,אוקטובר,נובמבר,דצמבר" | split: "," -%}
{%- assign m = include.date | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%-d" }} ב{{ months[m] }} {{ include.date | date: "%Y" }}</time>
