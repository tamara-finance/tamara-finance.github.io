{%- if page.url == "/" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FinancialService",
  "name": "תמרה אביב - ייעוץ משכנתאות",
  "alternateName": "תמרה אביב משכנתא מא' עד ת'",
  "description": {{ site.description | jsonify }},
  "url": {{ site.url | jsonify }},
  "logo": {{ site.url | append: site.logo | jsonify }},
  "image": {{ site.url | append: '/assets/images/tamara.jpg' | jsonify }},
  "telephone": "+972-54-2555-754",
  "email": {{ site.data.contact.email | jsonify }},
  "areaServed": { "@type": "Country", "name": "ישראל" },
  "availableChannel": [
    { "@type": "ServiceChannel", "name": "ייעוץ אונליין בשיחת וידאו - בכל הארץ" },
    { "@type": "ServiceChannel", "name": "פגישות פרונטליות ברחובות והסביבה" }
  ],
  "address": { "@type": "PostalAddress", "addressLocality": "רחובות", "addressCountry": "IL" },
  "founder": { "@type": "Person", "name": "תמרה אביב", "jobTitle": "יועצת משכנתאות וכלכלנית" },
  "sameAs": [{{ site.data.contact.instagram | jsonify }}, {{ site.data.contact.facebook | jsonify }}, {{ site.data.contact.linkedin | jsonify }}, {{ site.data.contact.tiktok | jsonify }}, {{ site.data.contact.google | jsonify }}],
  "knowsAbout": ["ייעוץ משכנתאות אונליין", "ייעוץ משכנתאות", "מיחזור משכנתא", "משכנתא לדירה ראשונה", "איחוד הלוואות", "משכנתא לעצמאים", "משכנתא הפוכה"]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [{% for item in site.data.faq %}
    { "@type": "Question", "name": {{ item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} } }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
{%- endif -%}
