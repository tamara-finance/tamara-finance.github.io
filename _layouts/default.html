<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4e79">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  {% seo %}
  {% include schema.html %}
  {% include analytics.html %}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/icon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/icon-180.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">דילוג לתוכן</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include contact.html %}
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
